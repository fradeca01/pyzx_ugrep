services:
  backend:
    build:
      context: . 
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend
    environment:
      - PYTHONUNBUFFERED=1
      - UGR_MAX_ACTIVE_JOBS=${UGR_MAX_ACTIVE_JOBS:-2}
      - UGR_MAX_JOB_RUNTIME_SECONDS=${UGR_MAX_JOB_RUNTIME_SECONDS:-60}
      - UGR_JOB_IDLE_TIMEOUT_SECONDS=${UGR_JOB_IDLE_TIMEOUT_SECONDS:-15}
      - UGR_MAX_GENERATE_N=${UGR_MAX_GENERATE_N:-40}
      - UGR_MAX_DOT_NODES=${UGR_MAX_DOT_NODES:-40}
      - UGR_MAX_SOLVE_NODES=${UGR_MAX_SOLVE_NODES:-24}
      - UGR_MAX_STABILIZERS=${UGR_MAX_STABILIZERS:-64}

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "3000:3000" 
    volumes:
      - ./frontend:/app
      - /app/node_modules 
    depends_on:
      - backend 
